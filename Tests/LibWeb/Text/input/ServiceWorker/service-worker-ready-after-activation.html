<!doctype html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const runId = uniqueID();
        const javascript = { "Content-Type": "text/javascript", "Cache-Control": "no-store" };
        const scriptURL = await server.createEcho("GET", `/service-worker-ready-after-activation-${runId}.js`, { status: 200, headers: { ...javascript, "Service-Worker-Allowed": "/" }, body: "" });
        const scope = new URL("./", location.href).href;

        const ready = navigator.serviceWorker.ready;
        await new Promise(resolve => setTimeout(resolve, 0));

        const registration = await navigator.serviceWorker.register(scriptURL, { scope });
        const readyRegistration = await ready;
        println(`ready resolves with the registration: ${readyRegistration === registration}`);
        println(`ready registration has an active worker: ${readyRegistration.active !== null}`);
        println(`ready is still the same promise: ${ready === navigator.serviceWorker.ready}`);
        println(`unregister() resolves with: ${await registration.unregister()}`);
    });
</script>
