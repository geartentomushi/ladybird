<!doctype html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const runId = uniqueID();
        const channelName = `service-worker-global-registration-${runId}`;
        const workerScript = `
            const channel = new BroadcastChannel("${channelName}");
            const report = phase => channel.postMessage({
                phase,
                scope: self.registration.scope === new URL("/", location.href).href,
                updateViaCache: self.registration.updateViaCache,
                sameObjects: self.registration === self.registration && self.serviceWorker === self.serviceWorker,
                state: self.serviceWorker.state,
                installing: self.registration.installing === self.serviceWorker,
                active: self.registration.active === self.serviceWorker,
            });
            report("script");
            self.addEventListener("install", () => report("install"));
            self.addEventListener("activate", () => report("activate"));
        `;
        const javascript = { "Content-Type": "text/javascript", "Cache-Control": "no-store", "Service-Worker-Allowed": "/" };
        const scriptURL = await server.createEcho("GET", `/service-worker-global-registration-${runId}.js`, { status: 200, headers: javascript, body: workerScript });

        const reports = [];
        const channel = new BroadcastChannel(channelName);
        const allReported = new Promise(resolve => {
            channel.onmessage = event => {
                reports.push(event.data);
                if (event.data.phase === "activate")
                    resolve();
            };
        });

        const registration = await navigator.serviceWorker.register(scriptURL, { scope: "/", updateViaCache: "none" });
        await allReported;
        for (const report of reports)
            println(JSON.stringify(report));
        channel.close();
        println(`unregister() resolves with: ${await registration.unregister()}`);
    });
</script>
