<!doctype html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const runId = uniqueID();
        const javascript = { "Content-Type": "text/javascript", "Cache-Control": "no-store" };
        const scriptURL = await server.createEcho("GET", `/service-worker-unregister-${runId}/worker.js`, { status: 200, headers: javascript, body: "" });
        const scope = server.echoURL(`/service-worker-unregister-${runId}/scope/`);

        function waitForState(worker, state) {
            if (worker.state === state)
                return Promise.resolve();
            return new Promise(resolve => worker.addEventListener("statechange", function listener() {
                if (worker.state !== state)
                    return;
                worker.removeEventListener("statechange", listener);
                resolve();
            }));
        }

        const registration = await navigator.serviceWorker.register(scriptURL, { scope });
        const worker = registration.installing;
        await waitForState(worker, "activated");
        println(`active before unregister: ${registration.active === worker}`);

        const redundant = waitForState(worker, "redundant");
        println(`unregister() resolves with: ${await registration.unregister()}`);
        await redundant;
        await new Promise(resolve => setTimeout(resolve, 0));
        println(`worker state: ${worker.state}`);
        println(`active after unregister: ${registration.active}`);
        println(`getRegistration() after unregister: ${await navigator.serviceWorker.getRegistration(scope)}`);
        println(`second unregister() resolves with: ${await registration.unregister()}`);

        const newRegistration = await navigator.serviceWorker.register(scriptURL, { scope });
        println(`register() again gives a new registration: ${newRegistration !== registration}`);
        await waitForState(newRegistration.installing, "activated");
        println(`new registration unregister() resolves with: ${await newRegistration.unregister()}`);

        const extendedURL = await server.createEcho("GET", `/service-worker-unregister-${runId}/extended.js`, { status: 200, headers: javascript, body: `
            addEventListener("activate", event => event.waitUntil(new Promise(resolve => setTimeout(resolve, 100))));
        ` });
        const extendedScope = server.echoURL(`/service-worker-unregister-${runId}/extended/`);
        const extendedRegistration = await navigator.serviceWorker.register(extendedURL, { scope: extendedScope });
        const extendedWorker = extendedRegistration.installing;
        const extendedStates = [extendedWorker.state];
        const extendedRedundant = new Promise(resolve => extendedWorker.addEventListener("statechange", () => {
            extendedStates.push(extendedWorker.state);
            if (extendedWorker.state === "redundant")
                resolve();
        }));
        await waitForState(extendedWorker, "activating");
        println(`unregister() during activation resolves with: ${await extendedRegistration.unregister()}`);
        println(`worker state when unregister() resolves: ${extendedWorker.state}`);
        await extendedRedundant;
        println(`worker unregistered during activation: ${extendedStates.join(" -> ")}`);

        try {
            await registration.unregister.call({});
        } catch (error) {
            println(`unregister() on a non-registration throws ${error.name}`);
        }
    });
</script>
