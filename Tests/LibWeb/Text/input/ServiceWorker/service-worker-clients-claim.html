<!doctype html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const runId = uniqueID();
        const channelName = `service-worker-clients-claim-${runId}`;
        const workerScript = `
            const channel = new BroadcastChannel("${channelName}");
            const report = message => channel.postMessage(message);
            report("clients is the same object: " + (self.clients === self.clients));
            self.clients.claim().then(
                () => report("claim() before activation resolved"),
                error => report("claim() before activation rejects with " + error.name));
            self.addEventListener("activate", event => {
                event.waitUntil(self.clients.claim().then(
                    value => report("claim() during activate resolves with " + value),
                    error => report("claim() during activate rejects with " + error.name)));
            });
        `;
        const javascript = { "Content-Type": "text/javascript", "Cache-Control": "no-store", "Service-Worker-Allowed": "/" };
        const scriptURL = await server.createEcho("GET", `/service-worker-clients-claim-${runId}.js`, { status: 200, headers: javascript, body: workerScript });

        const reports = [];
        const channel = new BroadcastChannel(channelName);
        const allReported = new Promise(resolve => {
            channel.onmessage = event => {
                reports.push(event.data);
                if (event.data.startsWith("claim() during activate"))
                    resolve();
            };
        });

        const registration = await navigator.serviceWorker.register(scriptURL, { scope: "/" });
        await allReported;
        for (const report of reports)
            println(report);
        channel.close();
        println(`unregister() resolves with: ${await registration.unregister()}`);
    });
</script>
