<!doctype html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const runId = uniqueID();
        const javascript = { "Content-Type": "text/javascript", "Cache-Control": "no-store" };
        const script = (name, body) => server.createEcho("GET", `/service-worker-lifecycle-${runId}/${name}`, { status: 200, headers: javascript, body });
        const scope = name => server.echoURL(`/service-worker-lifecycle-${runId}/${name}/`);

        function recordStates(worker) {
            const states = [worker.state];
            const done = new Promise(resolve => {
                worker.addEventListener("statechange", () => {
                    states.push(worker.state);
                    if (worker.state === "activated" || worker.state === "redundant")
                        resolve(states);
                });
            });
            return done;
        }

        async function register(name, body) {
            const scriptURL = await script(`${name}.js`, body);
            try {
                const registration = await navigator.serviceWorker.register(scriptURL, { scope: scope(name) });
                const worker = registration.installing;
                println(`${name}: resolved with a ServiceWorkerRegistration: ${registration instanceof ServiceWorkerRegistration}`);
                println(`${name}: installing worker's script URL matches: ${worker.scriptURL === scriptURL}`);
                println(`${name}: states: ${(await recordStates(worker)).join(" -> ")}`);
                println(`${name}: active worker: ${registration.active === worker}, installing: ${registration.installing}, waiting: ${registration.waiting}`);
                const found = await navigator.serviceWorker.getRegistration(scope(name));
                println(`${name}: getRegistration() finds it: ${found === registration}`);
            } catch (error) {
                println(`${name}: rejected with ${error.name}`);
                println(`${name}: getRegistration() after: ${await navigator.serviceWorker.getRegistration(scope(name))}`);
            }
        }

        await register("empty", "");
        await register("extended", `
            addEventListener("install", event => event.waitUntil(new Promise(resolve => setTimeout(resolve, 50))));
            addEventListener("activate", event => event.waitUntil(Promise.resolve()));
        `);
        await register("skip-waiting", `addEventListener("install", () => self.skipWaiting());`);
        await register("failed-install", `addEventListener("install", event => event.waitUntil(Promise.reject(new Error("no"))));`);
        await register("throwing-script", `throw new Error("top-level failure");`);
    });
</script>
