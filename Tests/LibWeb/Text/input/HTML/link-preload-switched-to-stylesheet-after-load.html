<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const url = await httpTestServer().createEcho("GET", "/link-preload-switched-to-stylesheet-after-load", {
            status: 200,
            headers: { "Content-Type": "text/css" },
            body: "body { color: rgb(0, 128, 0); }",
        });

        const link = document.createElement("link");
        link.rel = "preload";
        link.as = "style";
        link.href = url;

        link.addEventListener("load", async () => {
            const stylesheetLoaded = new Promise(resolve => link.addEventListener("load", resolve, { once: true }));
            link.rel = "stylesheet";
            await Promise.resolve();
            println(`Body color after promotion: ${getComputedStyle(document.body).color}`);
            await stylesheetLoaded;
            println("Stylesheet load event fired");
            done();
        }, { once: true });

        document.head.append(link);
    });
</script>
