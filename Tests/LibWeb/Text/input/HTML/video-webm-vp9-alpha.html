<!doctype html>
<script src="../include.js"></script>
<video muted></video>
<script>
    asyncTest(async done => {
        const video = document.querySelector("video");
        await new Promise(resolve => {
            video.addEventListener("loadeddata", resolve, { once: true });
            video.src = httpTestServer().getStaticURL("Assets/vp9-alpha-32x32.webm");
        });

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        context.drawImage(video, 0, 0);
        println(`Left half alpha: ${context.getImageData(8, 16, 1, 1).data[3]}`);
        println(`Middle stripe alpha: ${context.getImageData(16, 16, 1, 1).data[3]}`);
        println(`Right half alpha: ${context.getImageData(24, 16, 1, 1).data[3]}`);

        context.fillStyle = "blue";
        context.fillRect(0, 0, 32, 32);
        context.drawImage(video, 0, 0);
        const [red, , blue, alpha] = context.getImageData(16, 16, 1, 1).data;
        println(`Middle stripe blends red video and blue background: ${Math.abs(red - 128) <= 3 && Math.abs(blue - 127) <= 3 && alpha === 255}`);
        done();
    });
</script>
