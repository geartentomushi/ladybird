<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const optionsByType = {
            password: { password: true, mediation: "silent" },
            federated: { federated: { providers: ["https://example.com"] } },
            publicKey: { publicKey: { challenge: new Uint8Array() }, mediation: "conditional" },
            identity: { identity: { providers: [] } },
        };
        for (const [type, options] of Object.entries(optionsByType)) {
            const result = navigator.credentials.get(options);
            await result.then(
                () => println(`${type}: unexpectedly fulfilled`),
                error => println(`${type}: ${error instanceof DOMException ? error.name : String(error)}`)
            );
        }
    });
</script>
