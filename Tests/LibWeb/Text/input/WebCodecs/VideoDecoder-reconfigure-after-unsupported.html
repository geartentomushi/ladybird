<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const decoder = new VideoDecoder({
            output: frame => frame.close(),
            error: e => {
                println(`Error: ${e.name}`);
                println(`State: ${decoder.state}`);
                done();
            },
        });
        decoder.configure({ codec: "bogus" });
        decoder.configure({ codec: "avc1.42c01e" });
        println(`State after reconfiguring: ${decoder.state}`);
    });
</script>
