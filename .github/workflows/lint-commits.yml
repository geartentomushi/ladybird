name: Lint Commit Messages

on: [pull_request_target, workflow_call]

# Make sure to update Meta/lint-commit.sh to match this script when adding new checks!
# (… but don't accept overlong 'fixup!' commit descriptions.)

jobs:
  lint:
    runs-on: ${{ github.repository == 'LadybirdBrowser/ladybird' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    if: |
      (github.repository == 'LadybirdBrowser/ladybird' && github.event_name == 'pull_request_target') ||
      (github.repository == 'geartentomushi/ladybird' && github.event_name == 'pull_request')
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Lint fork PR commits with base rules
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { spawnSync } = require("node:child_process");
            const { mkdtempSync, rmSync, writeFileSync } = require("node:fs");
            const { tmpdir } = require("node:os");
            const { join } = require("node:path");
            const { pull_request } = context.payload;
            const { data: script } = await github.rest.repos.getContent({
              ...context.repo, path: "Meta/lint-commit.sh", ref: pull_request.base.sha,
            });
            if (script.type !== "file" || script.encoding !== "base64") {
              throw new Error("Could not read Meta/lint-commit.sh from the PR base");
            }
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pull_request.number, per_page: 100,
            });
            const directory = mkdtempSync(join(tmpdir(), "commit-lint-"));
            const linter = join(directory, "lint-commit.sh");
            const messageFile = join(directory, "message");
            const errors = [];
            try {
              writeFileSync(linter, Buffer.from(script.content, "base64"));
              for (const { sha, commit: { message }, author } of commits) {
                if (author?.id === 49699333) continue; // dependabot[bot]
                writeFileSync(messageFile, message + "\n");
                const result = spawnSync("bash", [linter, messageFile], { encoding: "utf-8" });
                if (result.error) throw result.error;
                if (result.status !== 0) {
                  errors.push(`${sha}: ${result.stdout.trim() || result.stderr.trim() || "Commit linter failed"}`);
                }
              }
            } finally {
              rmSync(directory, { recursive: true, force: true });
            }
            if (errors.length > 0) core.setFailed(errors.join("\n"));

      - name: Lint PR commits
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v9
        with:
          script: |
            const excludedBotIds = [
              49699333,  // dependabot[bot]
            ];
            const rules = [
              {
                pattern: /^[^\r]*$/,
                error: "Commit message contains CRLF line breaks (only unix-style LF linebreaks are allowed)",
              },
              {
                line: 2,
                pattern: /^$/,
                error: "Empty line between commit title and body is missing",
              },
              {
                line: 1,
                pattern: /^(?!Merge branch )/,
                error: "Commit is a git merge commit, use the rebase command instead",
              },
              {
                line: 1,
                pattern: /^(Revert "|\S+: )/,
                error: "Missing category in commit title (if this is a fix up of a previous commit, it should be squashed)",
              },
              {
                line: 1,
                pattern: /^\S.*?: [A-Z0-9]/,
                error: "First word of commit after the subsystem is not capitalized",
              },
              {
                line: 1,
                pattern: /[^.]$/,
                error: "Commit title ends in a period",
              },
              {
                pattern: /^(.{0,72}|\s*[a-z]+:\/\/([a-z0-9\-]+\.)+[a-z]{2,}(:\d+)?(\/[a-zA-Z_0-9@#:;%+.~?&=\-]+)*)$/,
                error: "Commit message lines are too long (maximum allowed is 72 characters, except for URLs on their own line)",
              },
              {
                pattern: /^(?!Signed-off-by: )/,
                error: "Commit body contains a Signed-off-by tag",
              },
            ];

            const { repository, pull_request } = context.payload;

            // NOTE: This maxes out at 250 commits. If this becomes a problem, see:
            // https://octokit.github.io/rest.js/v18#pulls-list-commits
            const opts = github.rest.pulls.listCommits.endpoint.merge({
              owner: repository.owner.login,
              repo: repository.name,
              pull_number: pull_request.number,
            });
            const commits = await github.paginate(opts);

            const errors = [];
            for (const { sha, commit: { message }, author } of commits) {
              if (author !== null && excludedBotIds.includes(author.id)) {
                continue;
              }
              let commitErrors = [];
              message.split("\n").forEach((line, index) => {
                for (const { line: ruleLine, pattern, error } of rules) {
                  if (ruleLine !== undefined && ruleLine !== index + 1) {
                    continue;
                  }
                  if (!pattern.test(line)) {
                    commitErrors.push(error);
                  }
                }
              });
              if (commitErrors.length > 0) {
                const title = message.split("\n")[0];
                commitErrors = [...new Set(commitErrors)];  // remove duplicates
                errors.push([`${title} (${sha}):`, ...commitErrors].join("\n  "));
              }
            }

            if (errors.length > 0) {
              core.setFailed(`One or more of the commits in this PR do not match the code submission policy:\n\n${errors.join("\n")}`);
            }
