name: Lint Code

on:
  push:
    branches: [master, 'release/*']
  pull_request:

jobs:
  fork-commit-messages:
    name: Fork commit messages
    if: github.repository == 'geartentomushi/ladybird' && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/lint-commits.yml

  lint:
    name: ${{ github.repository == 'geartentomushi/ladybird' && 'Fork code lint' || 'lint' }}
    runs-on: ${{ github.repository == 'LadybirdBrowser/ladybird' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    if: github.repository == 'LadybirdBrowser/ladybird' || github.repository == 'geartentomushi/ladybird'
    permissions:
      contents: read
    container:
      image: ghcr.io/ladybirdbrowser/ladybird-ci:2026.11.21

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set Up Environment
        uses: ./.github/actions/setup
        with:
          os: 'Linux'
          arch: 'x86_64'
          type: 'lint'

      - name: Install the toolchain of the Rust GC lints
        working-directory: Meta/RustLints
        run: rustup toolchain install

      - name: Lint
        run: "${GITHUB_WORKSPACE}/Meta/lint-ci.sh"

  flap:
    name: ${{ github.repository == 'geartentomushi/ladybird' && 'Fork Flap checks' || 'flap' }}
    permissions:
      contents: read
    runs-on: ${{ github.repository == 'LadybirdBrowser/ladybird' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    if: github.repository == 'LadybirdBrowser/ladybird' || github.repository == 'geartentomushi/ladybird'
    container:
      image: ghcr.io/ladybirdbrowser/ladybird-ci:2026.11.21

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Environment
        uses: ./.github/actions/setup
        with:
          os: 'Linux'
          arch: 'x86_64'
          type: 'lint'

      - name: Check Flap
        run: |
          cargo fmt --manifest-path Libraries/LibJS/Flap/Cargo.toml -- --check
          cargo clippy --manifest-path Libraries/LibJS/Flap/Cargo.toml \
            --all-targets -- -D clippy::all

      - name: Generate and assemble the Flap interpreter
        run: |
          cargo build --release --manifest-path Libraries/LibJS/Flap/Cargo.toml
          mkdir -p "${RUNNER_TEMP}/flap-smoke"
          for arch in x86_64 aarch64; do
            Libraries/LibJS/Flap/target/release/flapc \
              --arch "${arch}" \
              --object-format elf \
              --constants Libraries/LibJS/Flap/tests/interpreter-layout.conf \
              --input Libraries/LibJS/Interpreter/interpreter.flap \
              --output "${RUNNER_TEMP}/flap-smoke/${arch}.S"
            clang --target="${arch}-unknown-linux-gnu" \
              -c "${RUNNER_TEMP}/flap-smoke/${arch}.S" \
              -o "${RUNNER_TEMP}/flap-smoke/${arch}.o"
            Libraries/LibJS/Flap/target/release/flapc \
              --arch "${arch}" \
              --object-format elf \
              --constants Libraries/LibJS/Flap/tests/interpreter-layout.conf \
              --input Libraries/LibJS/Interpreter/interpreter.flap \
              --output "${RUNNER_TEMP}/flap-smoke/${arch}-repeat.S"
            cmp "${RUNNER_TEMP}/flap-smoke/${arch}.S" \
              "${RUNNER_TEMP}/flap-smoke/${arch}-repeat.S"
          done
